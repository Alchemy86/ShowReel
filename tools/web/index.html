<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowReel — in the browser</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230d1117' stroke='%2330363d' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23f0f3f6' stroke-width='9'/%3E%3Cpolygon points='43,34 57,34 64,50 57,66 43,66 36,50' fill='%23ffd147'/%3E%3C/svg%3E">
<style>
/* Palette matches src/studio/page.css: #0d1117 ground, #ffd147 accent, the
   same iris mark. This page and the native studio should feel like the same
   tool even though nothing here talks to a server. */
:root {
  --bg: #0d1117; --panel: #12161d; --panel-2: #161b22; --panel-3: #1b212b; --border: #262c36;
  --ink: #f0f3f6; --muted: #8b949e; --dim: #5c6472;
  --accent: #ffd147; --accent-ink: #1a1506;
  --danger: #ff6b6b; --danger-bg: #2a1414; --danger-border: #4a2020;
  --ok: #57d68d;
  --body: "Open Sans", Inter, "Noto Sans", "Liberation Sans", "DejaVu Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13px; }
#app { min-height: 100%; height: 100%; display: flex; flex-direction: column; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

#topbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; flex-shrink: 0; }
#brand { display: flex; align-items: center; gap: 7px; color: var(--accent); flex-shrink: 0; }
#brand-mark { color: var(--ink); flex-shrink: 0; }
#brand-mark polygon { fill: var(--accent); }
#brand-name { font-weight: 700; letter-spacing: .02em; }
#brand-sub { color: var(--muted); font-weight: 400; }
#film-title { font-weight: 600; }
#film-stats { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-left: auto; }
.toolbar-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.toolbar-btn:hover { border-color: var(--accent); }
.toolbar-btn:disabled { opacity: .4; cursor: default; }
.toolbar-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

#error-banner { background: var(--danger-bg); border-bottom: 1px solid var(--danger-border);
  color: var(--danger); padding: 8px 16px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; flex-shrink: 0; }
#error-banner[hidden] { display: none; }

#editor-body { flex: 1; min-height: 0; display: flex; }
#panel-timeline, #panel-inspector { width: 300px; flex-shrink: 0; overflow-y: auto; background: var(--panel);
  display: flex; flex-direction: column; }
#panel-timeline { border-right: 1px solid var(--border); }
#panel-inspector { border-left: 1px solid var(--border); width: 340px; }
#center-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

#stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
  background: #000; min-height: 0; padding: 10px; position: relative; }
/* `object-fit: contain` keeps this box's on-screen size fixed regardless of
   the canvas's intrinsic pixel buffer — playback renders into a smaller
   buffer (see main.js's draft scale) and the browser upscales it to fill the
   same box, rather than the box itself shrinking. */
#view { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
#splash { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg);
  color: var(--muted); font-family: var(--mono); font-size: 13px; text-align: center; }
#splash b { color: var(--ink); }
#splash[hidden] { display: none; }

/* Sits over the canvas at exactly its `object-fit: contain` box (the same
   10px inset `#stage-wrap`'s padding gives the canvas) — see main.js's
   `stageImageRect` for the letterbox math that places `#sel-box` within it. */
#stage-overlay { position: absolute; inset: 10px; cursor: default; }
#sel-box { position: absolute; border: 2px solid var(--accent); border-radius: 3px; cursor: move;
  background: rgba(255, 209, 71, .08); }
#sel-box[hidden] { display: none; }
.sel-label { position: absolute; top: -22px; left: -2px; background: var(--accent); color: var(--accent-ink);
  font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px 4px 4px 0; white-space: nowrap;
  max-width: 240px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

/* ---- callout pins: a ring at the target, a tag at the label, a line between ---- */
#sel-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#sel-line[hidden] { display: none; }
#sel-line line { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.sel-pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px solid var(--accent);
  border-radius: 50%; background: rgba(255, 209, 71, .15); cursor: grab; }
.sel-pin:active { cursor: grabbing; }
.sel-pin[hidden] { display: none; }
.sel-pin-label { width: auto; height: auto; margin: -14px 0 0 -14px; border-radius: 6px; padding: 4px 9px;
  background: var(--accent); border-color: var(--accent); display: flex; align-items: center; }
.sel-pin-label .pin-text { color: var(--accent-ink); font-size: 11px; font-weight: 700; white-space: nowrap;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

#transport { display: flex; align-items: center; gap: 10px; padding: 7px 16px;
  border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
.icon-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn:disabled { opacity: .4; cursor: default; }
#timecode { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 13ch; }
#fps-readout { font-family: var(--mono); font-size: 12px; color: var(--dim); }

#scrubber-wrap { padding: 5px 16px 9px; background: var(--panel); border-top: 1px solid var(--border); flex-shrink: 0; }
#scrubber { position: relative; height: 24px; }
#scenes { position: absolute; inset: 0; display: flex; border-radius: 4px; overflow: hidden; top: 7px; height: 10px; }
#scenes div { border-right: 1px solid var(--bg); background: var(--panel-2); position: relative; cursor: pointer; }
#scenes div:nth-child(odd) { background: #1c222c; }
#seek { position: absolute; inset: 0; width: 100%; height: 24px; margin: 0; appearance: none;
  background: transparent; cursor: pointer; }
#seek::-webkit-slider-runnable-track { height: 24px; background: transparent; }
#seek::-webkit-slider-thumb { appearance: none; width: 3px; height: 24px; background: var(--accent);
  border-radius: 1px; margin-top: 0; }
#seek::-moz-range-track { height: 24px; background: transparent; }
#seek::-moz-range-thumb { width: 3px; height: 24px; background: var(--accent); border: none; border-radius: 1px; }

/* ---- shared panel chrome, used by editor.js's generated markup ---- */
.pane { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
.pane h2 .mini-btn { text-transform: none; letter-spacing: 0; }
.mini-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 2px 8px; border-radius: 5px; cursor: pointer; font-size: 11.5px; font-weight: 600; }
.mini-btn:hover { border-color: var(--accent); }
.mini-btn:disabled { opacity: .35; cursor: default; }
.mini-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

.row { display: flex; gap: 1px; flex-direction: column; }
.chip-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 5px; cursor: pointer;
  border: 1px solid transparent; }
.chip-row:hover { background: var(--panel-2); }
.chip-row.selected { background: var(--panel-3); border-color: var(--accent); }
.chip-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-row .meta { color: var(--dim); font-family: var(--mono); font-size: 11px; flex-shrink: 0; }
.chip-row .drag-handle { color: var(--dim); cursor: grab; flex-shrink: 0; }
.chip-row[draggable="true"]:active { cursor: grabbing; }
.transition-chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px; margin: 2px 0;
  color: var(--muted); font-size: 11.5px; cursor: pointer; border-radius: 5px; }
.transition-chip:hover { background: var(--panel-2); color: var(--ink); }
.transition-chip .glyph { color: var(--dim); }

.field { margin-bottom: 9px; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.field-row { display: flex; gap: 8px; }
.field-row .field { flex: 1; min-width: 0; }
input[type="text"], input[type="number"], input[type="url"], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 5px 7px; border-radius: 5px; }
input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
input[type="color"] { width: 36px; height: 26px; padding: 2px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 5px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
textarea { font-family: var(--mono); font-size: 11.5px; resize: vertical; min-height: 90px; }
.check-field { display: flex; align-items: center; font-size: 12px; color: var(--ink); }
.hint { color: var(--dim); font-size: 11px; margin-top: 4px; line-height: 1.4; }
.empty-hint { color: var(--dim); font-size: 12px; padding: 8px 0; }

.add-menu { position: relative; }
.add-menu-list { position: absolute; z-index: 20; top: 100%; left: 0; margin-top: 4px; background: var(--panel-3);
  border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.4); min-width: 160px;
  padding: 4px; }
.add-menu-list button { display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--ink); padding: 6px 9px; border-radius: 4px; cursor: pointer; }
.add-menu-list button:hover { background: var(--panel-2); }
.add-menu-list[hidden] { display: none; }
.add-menu-sep { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  padding: 6px 9px 3px; border-top: 1px solid var(--border); margin-top: 3px; }

/* ---- effect preset grid (replaces a raw Motion-kind dropdown) ---- */
.effect-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.effect-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
  padding: 7px 4px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; }
.effect-btn:hover { border-color: var(--accent); }
.effect-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---- 3x3 anchor quick-pick, in front of the exact placement editor ---- */
.anchor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 108px; margin: 6px 0; }
.anchor-btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
  width: 32px; height: 32px; display: grid; place-items: center; padding: 0; }
.anchor-btn:hover { border-color: var(--accent); }
.anchor-btn span { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.anchor-btn.active { border-color: var(--accent); background: var(--panel-3); }
.anchor-btn.active span { background: var(--accent); }

/* ---- clip trim widget: drag the ends instead of typing seconds ---- */
.trim-track { position: relative; height: 28px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; margin: 4px 0 2px; }
.trim-window { position: absolute; top: 3px; bottom: 3px; background: rgba(255, 209, 71, .22);
  border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
.trim-handle { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; cursor: ew-resize;
  display: flex; align-items: center; justify-content: center; touch-action: none; }
.trim-handle::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); }
.trim-handle:hover::before { background: var(--ink); }

.pane-adv { padding: 0; border-bottom: 1px solid var(--border); }
.pane-adv > summary { cursor: pointer; color: var(--dim); font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; padding: 10px 12px; }
.pane-adv .pane { border-bottom: none; padding-top: 0; }

.asset-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; font-size: 12px; }
.asset-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--dim); }
.asset-row .dot.ok { background: var(--ok); }
.asset-row .dot.missing { background: var(--danger); }
.asset-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }

details.adv { margin-top: 6px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }

#export-modal, #open-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
  align-items: center; justify-content: center; z-index: 50; }
#export-modal[hidden], #open-modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
  width: 380px; max-width: 90vw; }
.modal-box h3 { margin: 0 0 12px; font-size: 14px; }
.progress-track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .1s linear; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.modal-note { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">
      <svg id="brand-mark" viewBox="0 0 100 100" width="20" height="20" aria-hidden="true">
        <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="9"/>
        <polygon points="43,34 57,34 64,50 57,66 43,66 36,50"/>
      </svg>
      <span id="brand-name">ShowReel</span>
      <span id="brand-sub">— in the browser</span>
    </div>
    <div id="film-title"></div>
    <button id="btn-open" class="toolbar-btn">Open film…</button>
    <button id="btn-new-still" class="toolbar-btn">+ Still</button>
    <button id="btn-new-clip" class="toolbar-btn">+ Clip</button>
    <button id="btn-save" class="toolbar-btn">Save JSON</button>
    <button id="btn-export" class="toolbar-btn primary">Export video…</button>
    <div id="film-stats"></div>
  </header>

  <div id="error-banner" hidden></div>

  <div id="editor-body">
    <nav id="panel-timeline"></nav>

    <main id="center-col">
      <div id="stage-wrap">
        <canvas id="view"></canvas>
        <div id="stage-overlay">
          <svg id="sel-line" hidden><line x1="0" y1="0" x2="0" y2="0"/></svg>
          <div id="sel-box" hidden><div class="sel-label"></div></div>
          <div id="sel-pin-target" class="sel-pin" hidden title="Drag to what it points at"></div>
          <div id="sel-pin-label" class="sel-pin sel-pin-label" hidden title="Drag to where it sits"><span class="pin-text"></span></div>
        </div>
        <div id="splash">loading…</div>
      </div>

      <div id="transport">
        <button id="btn-play" class="icon-btn" title="Play / pause (space)" disabled>▶</button>
        <div id="timecode">0:00.0 / 0:00.0</div>
        <div id="fps-readout" title="Achieved playback rate — best effort, not guaranteed real time"></div>
      </div>

      <div id="scrubber-wrap">
        <div id="scrubber">
          <div id="scenes"></div>
          <input type="range" id="seek" min="0" max="1" step="0.001" value="0" disabled>
        </div>
      </div>
    </main>

    <aside id="panel-inspector"></aside>
  </div>
</div>

<input type="file" id="file-open" accept=".json,.jsonc,application/json" hidden>
<input type="file" id="file-still" accept="image/*" hidden>
<input type="file" id="file-clip" accept="video/*" hidden>

<div id="export-modal" hidden>
  <div class="modal-box">
    <h3>Export video</h3>
    <div id="export-form"></div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
