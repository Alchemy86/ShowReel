[package]
name = "showreel"
version = "0.1.0"
edition = "2024"
description = "A declarative toolset for demo, explainer and animation films: timeline, camera, typography, transitions."
license = "MIT"
readme = "README.md"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
rustybuzz = "0.20"
ttf-parser = "0.25"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "showreel"
path = "src/bin/showreel.rs"

[profile.release]
opt-level = 3
lto = "thin"
